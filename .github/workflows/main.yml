name: FireFusion Multi-API CI/CD Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: Basic API Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FireFusion API dependencies
        run: |
          if [ -f backend/firefusion-api/requirements.txt ]; then
            pip install -r backend/firefusion-api/requirements.txt
          fi

      - name: Install Aggregator API dependencies
        run: |
          if [ -f backend/aggregator-api/requirements.txt ]; then
            pip install -r backend/aggregator-api/requirements.txt
          fi

      - name: Install Model API dependencies
        run: |
          if [ -f backend/model-api/requirements.txt ]; then
            pip install -r backend/model-api/requirements.txt
          fi


  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start backend stack
        working-directory: backend
        run: docker compose --profile default up --build -d

      - name: Wait for backend services to be ready
        working-directory: backend
        run: |
          urls="
          http://localhost:8080/ready
          http://localhost:8081/ready
          http://localhost:8082/ready
          "

          for url in $urls; do
            echo "Waiting for $url"

            ready=""

            for i in $(seq 1 40); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "Ready: $url"
                ready=1
                break
              fi

              echo "Attempt $i/40 - service not ready yet"
              sleep 3
            done

            if [ -z "$ready" ]; then
              echo "Timeout waiting for $url"
              docker compose --profile default ps
              docker compose --profile default logs
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: pip install -r backend/tests/requirements-test.txt

      - name: Run backend tests
        run: pytest backend/tests

      - name: Dump container logs on failure
        if: failure()
        working-directory: backend
        run: docker compose --profile default logs

      - name: Tear down backend stack
        if: always()
        working-directory: backend
        run: docker compose --profile default down -v


  docker-build-push:
    name: Build and Push API Images
    runs-on: ubuntu-latest

    needs:
      - backend-tests

    if: github.event_name == 'push'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: firefusion-api
            context: ./backend/firefusion-api
            dockerfile: ./backend/firefusion-api/Dockerfile
            image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/firefusion-api

          - service: aggregator-api
            context: ./backend/aggregator-api
            dockerfile: ./backend/aggregator-api/Dockerfile
            image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aggregator-api

          - service: model-api
            context: ./backend/model-api
            dockerfile: ./backend/model-api/Dockerfile
            image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/model-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}